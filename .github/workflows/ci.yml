name: CI

# Chạy CI khi push lên main và trên mỗi pull request nhắm vào main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Postgres: generate Prisma, migrate, e2e. Redis: refresh token (e2e auth/gateway)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      USER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/user_db?schema=public
      AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
      TASK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Secret chỉ dùng cho e2e trên CI (không có .env), không dùng ở môi trường nào khác
      JWT_ACCESS_SECRET: ci-only-access-secret-5f1d8c0e2b9a4e7d93c6
      JWT_REFRESH_SECRET: ci-only-refresh-secret-a83b47e1c0d2f6958e1b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create databases (mỗi service một DB)
        env:
          PGPASSWORD: postgres
        run: |
          for db in user_db auth_db task_db; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db;" || true
          done

      - name: Generate Prisma client (user-service)
        run: npm run prisma:user:generate

      # Áp dụng migration lên DB trống của CI rồi so DB với schema.prisma: sửa schema mà
      # quên tạo migration -> migrate diff thoát mã 2, CI đỏ
      - name: Apply migrations + check schema drift (user_db)
        run: |
          npx prisma migrate deploy --schema=apps/user-service/prisma/schema.prisma
          npx prisma migrate diff --exit-code \
            --from-schema-datasource apps/user-service/prisma/schema.prisma \
            --to-schema-datamodel apps/user-service/prisma/schema.prisma

      - name: Generate Prisma client (auth-service)
        run: npm run prisma:auth:generate

      # Áp dụng migration lên DB trống của CI rồi so DB với schema.prisma: sửa schema mà
      # quên tạo migration -> migrate diff thoát mã 2, CI đỏ
      - name: Apply migrations + check schema drift (auth_db)
        run: |
          npx prisma migrate deploy --schema=apps/auth-service/prisma/schema.prisma
          npx prisma migrate diff --exit-code \
            --from-schema-datasource apps/auth-service/prisma/schema.prisma \
            --to-schema-datamodel apps/auth-service/prisma/schema.prisma

      - name: Generate Prisma client (task-service)
        run: npm run prisma:task:generate

      # Áp dụng migration lên DB trống của CI rồi so DB với schema.prisma: sửa schema mà
      # quên tạo migration -> migrate diff thoát mã 2, CI đỏ
      - name: Apply migrations + check schema drift (task_db)
        run: |
          npx prisma migrate deploy --schema=apps/task-service/prisma/schema.prisma
          npx prisma migrate diff --exit-code \
            --from-schema-datasource apps/task-service/prisma/schema.prisma \
            --to-schema-datamodel apps/task-service/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build all apps
        run: |
          for app in gateway auth-service user-service task-service; do
            echo "Building $app..."
            npx nest build "$app"
          done

      - name: Test
        run: npm test

      # E2E chạy service thật qua TCP/HTTP với Postgres + Redis của CI
      - name: E2E User Service
        run: npm run test:e2e:user

      - name: E2E Auth Service
        run: npm run test:e2e:auth

      - name: E2E Gateway
        run: npm run test:e2e:gateway
